[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "analise-sinais-audio"
version = "0.1.0"
description = "Laboratório acadêmico de STFT e equalização automática de áudio"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
sinal = "signal_lab.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["signal_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
